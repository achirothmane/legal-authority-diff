[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-authority-diff"
version = "0.5.0"
description = "Differential regression testing for legal AI authority, citations, and claim support."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Legal Authority Diff contributors"}
]
dependencies = []

[project.optional-dependencies]
benchmark = ["pypdf>=5,<6"]

[project.scripts]
legal-diff = "legal_authority_diff.cli:main"
legal-enrich-citations = "legal_authority_diff.courtlistener:main"
legal-benchmark-support = "legal_authority_diff.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

name: authority-relation-v0.9

on:
  workflow_dispatch:

concurrency:
  group: authority-relation-v0.9
  cancel-in-progress: true

jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[benchmark]"
      - name: Run frozen V0.9 held-out relation benchmark
        run: python scripts/benchmark_v09_authority_relation.py
      - uses: actions/upload-artifact@v4
        with:
          name: v0.9-authority-relation-heldout-report
          path: /tmp/v0.9-authority-relation-report.json

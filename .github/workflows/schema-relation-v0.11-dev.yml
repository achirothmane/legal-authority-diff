name: schema-relation-v0.11-dev

on:
  workflow_dispatch:

jobs:
  development-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[benchmark,llm]"
      - name: Require API credential
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Missing repository Actions secret OPENAI_API_KEY"
            exit 2
          fi
      - name: Run V0.11 development replay
        run: >-
          python scripts/benchmark_v011_schema_relation_dev.py
          --model gpt-5.6-sol
          --reasoning-effort medium
          --output /tmp/v0.11-schema-relation-dev.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.11-schema-relation-dev
          path: /tmp/v0.11-schema-relation-dev.json
          if-no-files-found: ignore

name: test

on:
  push:
    branches: ["main", "v0.1-diff-engine", "v0.1-falsification-suite", "v0.2-courtlistener-adapter", "v0.2-live-courtlistener-smoke"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: legal-diff examples/baseline.jsonl examples/candidate.jsonl || test $? -eq 1
      - run: legal-diff benchmarks/synthetic/baseline.jsonl benchmarks/synthetic/candidate.jsonl || test $? -eq 1

  live-courtlistener-smoke:
    if: github.ref == 'refs/heads/v0.2-live-courtlistener-smoke'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Enrich baseline from live CourtListener
        run: |
          legal-enrich-citations \
            benchmarks/live-courtlistener/baseline.jsonl \
            /tmp/baseline.enriched.jsonl \
            --allow-unauthenticated \
            --delay 0
      - name: Enrich candidate from live CourtListener
        run: |
          legal-enrich-citations \
            benchmarks/live-courtlistener/candidate.jsonl \
            /tmp/candidate.enriched.jsonl \
            --allow-unauthenticated \
            --delay 0
      - name: Run end-to-end diff
        run: |
          set +e
          legal-diff \
            /tmp/baseline.enriched.jsonl \
            /tmp/candidate.enriched.jsonl \
            --json > /tmp/report.json
          code=$?
          set -e
          test "$code" -eq 1
      - name: Assert real-source evidence caused BLOCK
        run: |
          python scripts/assert_live_courtlistener_smoke.py \
            /tmp/baseline.enriched.jsonl \
            /tmp/candidate.enriched.jsonl \
            /tmp/report.json

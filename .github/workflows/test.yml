name: test

on:
  push:
    branches: ["main", "v0.1-diff-engine", "v0.1-falsification-suite", "v0.2-courtlistener-adapter", "v0.2-live-courtlistener-smoke"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: legal-diff examples/baseline.jsonl examples/candidate.jsonl || test $? -eq 1
      - run: legal-diff benchmarks/synthetic/baseline.jsonl benchmarks/synthetic/candidate.jsonl || test $? -eq 1

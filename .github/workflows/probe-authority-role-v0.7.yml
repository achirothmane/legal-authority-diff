name: probe-authority-role-v0.7

on:
  workflow_dispatch:
  push:
    branches: ["v0.7-authority-role"]

concurrency:
  group: probe-authority-role-v0.7
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[benchmark]"
      - run: python scripts/probe_v07_authority_role.py

name: live-support-benchmark-v0.5

on:
  workflow_dispatch:
  push:
    branches: ["v0.5-support-benchmark"]

jobs:
  live-support-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Require CourtListener token
        run: |
          if [ -z "$COURTLISTENER_TOKEN" ]; then
            echo "Missing repository secret: COURTLISTENER_TOKEN"
            exit 2
          fi
      - name: Cool down CourtListener lookup throttle
        run: sleep 30
      - name: Run 20-pair live support benchmark
        run: |
          legal-benchmark-support \
            benchmarks/real-claim-citation-v0.5/pairs.jsonl \
            --threshold 0.34 \
            --delay 7 \
            --output /tmp/v0.5-report.json
      - name: Report confusion matrix and mistakes
        run: python scripts/report_v05_benchmark.py /tmp/v0.5-report.json

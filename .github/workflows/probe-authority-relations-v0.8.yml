name: probe-authority-relations-v0.8

on:
  workflow_dispatch:
  push:
    branches: ["v0.8-authority-role-challenge"]

concurrency:
  group: probe-authority-relations-v0.8
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[benchmark]"
      - run: python scripts/probe_v08_relationships.py

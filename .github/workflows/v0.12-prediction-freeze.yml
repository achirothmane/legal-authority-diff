name: v0.12-prediction-freeze

on:
  workflow_dispatch:

concurrency:
  group: v0.12-prediction-freeze
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[benchmark]"
      - name: Validate frozen predictions
        run: python scripts/validate_v012_prediction_freeze.py
      - name: Build blind adjudication packet
        run: python scripts/build_v012_blind_adjudication_packet.py
      - uses: actions/upload-artifact@v4
        with:
          name: v0.12-prediction-freeze
          path: |
            /tmp/v0.12-prediction-validation.json
            /tmp/v0.12-blind-adjudication-packet.jsonl
